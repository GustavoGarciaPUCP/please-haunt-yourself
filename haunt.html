<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Please Haunt Yourself — Recovery desktop</title>
  <link rel="stylesheet" href="/src/haunt/desktop.css">
  <style>
    :root {
      --bone: #ede6d8;
      --charcoal: #171b20;
      --petrol: #305b62;
      --oxblood: #7d303a;
      --copper: #b5794a;
      --glass: rgba(29, 44, 47, 0.96);
      --shadow-1: rgba(0, 0, 0, 0.12);
      --shadow-2: rgba(0, 0, 0, 0.24);
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: radial-gradient(ellipse at 74% 62%, #65342e66, transparent 57%),
        radial-gradient(ellipse at 20% 12%, #305b6238, transparent 55%), #131a1f;
      color: var(--bone);
      overflow: hidden;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="desktop-root">
    <header class="os-menubar" aria-label="System menu bar">
      <span class="os-brand"><span aria-hidden="true">⌘</span> HAUNT OS</span>
      <details class="os-session-menu"><summary>Session</summary><div class="os-menu-panel" role="group" aria-label="Session actions">
        <button data-launch="terminal">Open Terminal</button><button data-launch="echo">Open Echo Studio</button><button data-open-guide>Show guide</button>
      </div></details>
      <span id="os-app-context">Desktop</span>
      <button id="btn-guide" aria-label="Open desktop guide">Guide <span aria-hidden="true">?</span></button>
      <time class="os-clock" aria-label="Local time"></time>
    </header>
    <main id="desktop-stage" role="main" aria-label="Recovery desktop">
      <header class="desktop-masthead">
        <p class="session-label"><span aria-hidden="true">✦</span> Recovery session</p>
        <h1>Please haunt yourself.</h1>
        <p class="desktop-task" aria-live="polite">Recovery task: free TERMINAL from its repeating session.<br>Enter the session, then return to check how it is doing.</p>
        <p class="workshop-task">ECHO capture workshop available separately.</p>
      </header>
      <nav class="desktop-shortcuts" aria-label="Desktop shortcuts">
        <button data-launch="terminal"><span class="desktop-icon terminal-icon" aria-hidden="true">&gt;_</span><span>Terminal</span></button>
        <button data-launch="echo"><span class="desktop-icon echo-icon" aria-hidden="true">◉</span><span>Echo Studio</span></button>
      </nav>
      <!-- Windows rendered here -->
    </main>

    <footer id="taskbar" role="navigation" aria-label="Applications">
      <div class="taskbar-apps">
        <button
          id="btn-terminal"
          class="taskbar-btn active"
          aria-label="TERMINAL - Recovery console"
          aria-pressed="true"
          data-app="terminal">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <rect x="2" y="3" width="16" height="14" rx="1" stroke="currentColor" stroke-width="1.5"/>
            <path d="M5 7l3 3-3 3M9 13h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span>TERMINAL</span>
        </button>

        <button
          id="btn-echo"
          class="taskbar-btn"
          aria-label="ECHO - Video application"
          aria-pressed="false"
          data-app="echo">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.5"/>
            <circle cx="8" cy="9" r="1.5" fill="currentColor"/>
            <circle cx="12" cy="9" r="1.5" fill="currentColor"/>
            <path d="M7 13c1 1.5 5 1.5 6 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span>ECHO</span>
        </button>

        <div class="taskbar-separator"></div>

        <div class="taskbar-labels">
          <span class="app-label" title="Not recovered yet">CANVAS</span>
          <span class="app-label" title="Farewell scenery available inside ECHO; app not recovered yet">UNINSTALL</span>
          <span class="app-label" title="Not recovered yet">REPLAY</span>
          <span class="app-label" title="Not recovered yet">POSTMAN</span>
        </div>
      </div>

      <div class="taskbar-status">
        <span class="status-text">Local rehearsal</span>
      </div>
    </footer>
  </div>

  <script type="module" src="/src/haunt/desktop.ts"></script>
</body>
</html>
